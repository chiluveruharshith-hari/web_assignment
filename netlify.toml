[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb-memory-server"]

# Route all /api/* requests to the serverless Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback for clean routing (static assets in /public take priority)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
