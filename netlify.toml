[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "JWT_SECRET,INITIAL_ADMIN_PASSWORD,INITIAL_ADMIN_EMAIL,MONGODB_URI"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb-memory-server"]

# Route all /api/* requests to the serverless Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback for clean routing (static assets in /public take priority)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
