version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:6.0
    container_name: campusfind-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - campusfind-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusfind-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/campusfind
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_placeholder}
      - JWT_EXPIRES_IN=7d
      - INITIAL_ADMIN_NAME=${INITIAL_ADMIN_NAME:-Campus Administrator}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@campusfind.edu}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-dev_admin_password_placeholder}
    networks:
      - campusfind-network

volumes:
  mongo-data:
    name: campusfind-mongo-data

networks:
  campusfind-network:
    name: campusfind-network
    driver: bridge
